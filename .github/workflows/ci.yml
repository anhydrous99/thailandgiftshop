name: CI

on:
  pull_request:
    paths:
      - "**/*.go"
      - "**/*.templ"
      - "cmd/devserver/**"
      - go.mod
      - go.sum
      - "infra/**"
      - "internal/ssr/**"
      - "scripts/**"
      - "web/package*.json"
      - "web/src/**"
      - "web/scripts/**"
      - "web/static/**"
      - "web/product-images/**"
      - "web/tests/**"
      - "web/playwright.config.ts"
      - .nvmrc
      - .github/workflows/ci.yml
      - .github/workflows/deploy.yml
  push:
    branches:
      - main
    paths:
      - "**/*.go"
      - "**/*.templ"
      - "cmd/devserver/**"
      - go.mod
      - go.sum
      - "infra/**"
      - "internal/ssr/**"
      - "scripts/**"
      - "web/package*.json"
      - "web/src/**"
      - "web/scripts/**"
      - "web/static/**"
      - "web/product-images/**"
      - "web/tests/**"
      - "web/playwright.config.ts"
      - .nvmrc
      - .github/workflows/ci.yml
      - .github/workflows/deploy.yml

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      CDK_DEFAULT_REGION: us-east-1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            infra/package-lock.json
            web/package-lock.json

      - name: Install infra Node dependencies
        run: npm --prefix infra ci

      - name: Audit infra production dependencies
        run: npm --prefix infra audit --omit=dev --audit-level=high

      - name: Install web Node dependencies
        run: npm --prefix web ci

      - name: Audit web production dependencies
        run: npm --prefix web audit --omit=dev --audit-level=high

      - name: Download Go dependencies
        run: go mod download

      - name: Build frontend assets
        run: npm --prefix web run build

      - name: Install Playwright Chromium
        run: npm --prefix web run test:install

      - name: Run frontend browser tests
        run: npm --prefix web test

      - name: Verify templ generated code
        run: |
          go tool templ generate
          tracked_templ_files="$(git ls-files '*_templ.go')"
          if [ -z "$tracked_templ_files" ]; then
            echo "No tracked generated templ files found."
            exit 1
          fi
          if ! git diff --exit-code -- $tracked_templ_files; then
            echo "Generated templ files are out of date. Run go tool templ generate."
            exit 1
          fi
          untracked_templ_files="$(git ls-files --others --exclude-standard '*_templ.go')"
          if [ -n "$untracked_templ_files" ]; then
            echo "Generated templ files are untracked:"
            echo "$untracked_templ_files"
            exit 1
          fi

      - name: Check Go formatting
        run: |
          files="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Run Go tests
        run: |
          packages="$(sh scripts/go-packages.sh)"
          go test $packages

      - name: Run Go vet
        run: |
          packages="$(sh scripts/go-packages.sh)"
          go vet $packages

      - name: Synthesize CDK app
        run: npm --prefix infra run synth
