name: CI

on:
  pull_request:
    paths:
      - "**/*.go"
      - "**/*.templ"
      - "cmd/devserver/**"
      - go.mod
      - go.sum
      - "infra/**"
      - "internal/ssr/**"
      - "scripts/**"
      - "web/package*.json"
      - "web/src/**"
      - "web/scripts/**"
      - "web/static/**"
      - "web/tests/**"
      - "web/playwright.config.ts"
      - .nvmrc
      - .github/workflows/ci.yml
      - .github/workflows/deploy.yml
  push:
    branches:
      - main
    paths:
      - "**/*.go"
      - "**/*.templ"
      - "cmd/devserver/**"
      - go.mod
      - go.sum
      - "infra/**"
      - "internal/ssr/**"
      - "scripts/**"
      - "web/package*.json"
      - "web/src/**"
      - "web/scripts/**"
      - "web/static/**"
      - "web/tests/**"
      - "web/playwright.config.ts"
      - .nvmrc
      - .github/workflows/ci.yml
      - .github/workflows/deploy.yml

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            infra/package-lock.json
            web/package-lock.json

      - name: Install infra Node dependencies
        run: npm --prefix infra ci

      - name: Install web Node dependencies
        run: npm --prefix web ci

      - name: Download Go dependencies
        run: go mod download

      - name: Build frontend assets
        run: npm --prefix web run build

      - name: Install Playwright Chromium
        run: npm --prefix web run test:install

      - name: Run frontend browser tests
        run: npm --prefix web test

      - name: Verify templ generated code
        run: |
          go tool templ generate
          status="$(git status --short)"
          if [ -n "$status" ]; then
            echo "$status"
            echo "Generated templ files are out of date. Run go tool templ generate."
            exit 1
          fi

      - name: Check Go formatting
        run: |
          files="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Run Go tests
        run: |
          packages="$(sh scripts/go-packages.sh)"
          go test $packages

      - name: Synthesize CDK app
        run: npm --prefix infra run synth
