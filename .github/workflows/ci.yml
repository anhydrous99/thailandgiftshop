name: CI

on:
  pull_request:
    paths:
      - "**/*.go"
      - "**/*.templ"
      - go.mod
      - go.sum
      - "infra/**"
      - "web/**"
      - .nvmrc
      - .github/workflows/ci.yml
      - .github/workflows/deploy.yml
  push:
    branches:
      - main
    paths:
      - "**/*.go"
      - "**/*.templ"
      - go.mod
      - go.sum
      - "infra/**"
      - "web/**"
      - .nvmrc
      - .github/workflows/ci.yml
      - .github/workflows/deploy.yml

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install Node dependencies
        working-directory: infra
        run: npm ci

      - name: Download Go dependencies
        run: go mod download

      - name: Verify templ generated code
        run: |
          go tool templ generate
          status="$(git status --short)"
          if [ -n "$status" ]; then
            echo "$status"
            echo "Generated templ files are out of date. Run go tool templ generate."
            exit 1
          fi

      - name: Check Go formatting
        run: |
          files="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Run Go tests
        run: |
          packages="$(git ls-files '*.go' | xargs -n1 dirname | sort -u | sed 's#^#./#')"
          go test $packages

      - name: Synthesize CDK app
        working-directory: infra
        run: npx cdk synth
