name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Production
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      ALARM_NOTIFICATION_EMAIL: ${{ vars.ALARM_NOTIFICATION_EMAIL }}
      ROUTE53_HOSTED_ZONE_ID: ${{ vars.ROUTE53_HOSTED_ZONE_ID }}

    steps:
      - name: Validate manual deploy source
        if: github.event_name == 'workflow_dispatch' && github.ref_name != 'main'
        env:
          DEPLOY_REF_NAME: ${{ github.ref_name }}
        run: |
          echo "::error title=Invalid manual deploy source::Manual production deploys must run from main, got '$DEPLOY_REF_NAME'."
          exit 1

      - name: Validate deploy configuration
        env:
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        run: |
          missing=0

          require_config() {
            local name="$1"
            local kind="$2"

            if [ -z "${!name}" ]; then
              echo "::error title=Missing deploy configuration::$kind '$name' must be set on the repository or production environment before deployment."
              missing=1
            fi
          }

          require_config "AWS_ROLE_TO_ASSUME" "GitHub Actions secret"
          require_config "ROUTE53_HOSTED_ZONE_ID" "GitHub Actions variable"
          require_config "ALARM_NOTIFICATION_EMAIL" "GitHub Actions variable"

          exit "$missing"

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Validate workflow run source SHA
        if: github.event_name == 'workflow_run'
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          remote_main_ref="$(git ls-remote origin refs/heads/main)"
          remote_main_sha="${remote_main_ref%%[[:space:]]*}"
          if [ -z "$remote_main_sha" ]; then
            echo "::error title=Missing main ref::Could not resolve origin/main."
            exit 1
          fi
          if [ "$DEPLOY_SHA" != "$remote_main_sha" ]; then
            echo "::error title=Stale deploy source::CI completed for '$DEPLOY_SHA', but origin/main is '$remote_main_sha'."
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            infra/package-lock.json
            web/package-lock.json

      - name: Install infra Node dependencies
        run: npm --prefix infra ci

      - name: Audit infra production dependencies
        run: npm --prefix infra audit --omit=dev --audit-level=high

      - name: Install web Node dependencies
        run: npm --prefix web ci

      - name: Audit web production dependencies
        run: npm --prefix web audit --omit=dev --audit-level=high

      - name: Build frontend assets
        run: npm --prefix web run build

      - name: Install Playwright Chromium
        run: npm --prefix web run test:install

      - name: Run frontend browser tests
        run: npm --prefix web test

      - name: Download Go dependencies
        run: go mod download

      - name: Verify templ generated code
        run: |
          go tool templ generate
          tracked_templ_files="$(git ls-files '*_templ.go')"
          if [ -z "$tracked_templ_files" ]; then
            echo "No tracked generated templ files found."
            exit 1
          fi
          if ! git diff --exit-code -- $tracked_templ_files; then
            echo "Generated templ files are out of date. Run go tool templ generate."
            exit 1
          fi
          untracked_templ_files="$(git ls-files --others --exclude-standard '*_templ.go')"
          if [ -n "$untracked_templ_files" ]; then
            echo "Generated templ files are untracked:"
            echo "$untracked_templ_files"
            exit 1
          fi

      - name: Check Go formatting
        run: |
          files="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Run Go tests
        run: |
          packages="$(sh scripts/go-packages.sh)"
          go test $packages

      - name: Run Go vet
        run: |
          packages="$(sh scripts/go-packages.sh)"
          go vet $packages

      - name: Synthesize CDK app
        run: npm --prefix infra run synth

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: thailandgiftshop-deploy

      - name: Diff CDK app
        working-directory: infra
        run: npx cdk diff ThailandGiftshopStack --parameters HostedZoneId="$ROUTE53_HOSTED_ZONE_ID" --parameters AlarmNotificationEmail="$ALARM_NOTIFICATION_EMAIL"

      - name: Deploy CDK app
        working-directory: infra
        run: npx cdk deploy ThailandGiftshopStack --require-approval never --parameters HostedZoneId="$ROUTE53_HOSTED_ZONE_ID" --parameters AlarmNotificationEmail="$ALARM_NOTIFICATION_EMAIL"
