name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Production
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      ROUTE53_HOSTED_ZONE_ID: ${{ vars.ROUTE53_HOSTED_ZONE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            infra/package-lock.json
            web/package-lock.json

      - name: Install infra Node dependencies
        run: npm --prefix infra ci

      - name: Install web Node dependencies
        run: npm --prefix web ci

      - name: Build frontend assets
        run: npm --prefix web run build

      - name: Download Go dependencies
        run: go mod download

      - name: Verify templ generated code
        run: |
          go tool templ generate
          status="$(git status --short)"
          if [ -n "$status" ]; then
            echo "$status"
            echo "Generated templ files are out of date. Run go tool templ generate."
            exit 1
          fi

      - name: Check Go formatting
        run: |
          files="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Run Go tests
        run: |
          packages="$(sh scripts/go-packages.sh)"
          go test $packages

      - name: Synthesize CDK app
        run: npm --prefix infra run synth

      - name: Validate deploy configuration
        run: |
          if [ -z "$ROUTE53_HOSTED_ZONE_ID" ]; then
            echo "ROUTE53_HOSTED_ZONE_ID repository or environment variable is required."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: thailandgiftshop-deploy

      - name: Deploy CDK app
        working-directory: infra
        run: npx cdk deploy ThailandGiftshopStack --require-approval never --parameters HostedZoneId="$ROUTE53_HOSTED_ZONE_ID"
